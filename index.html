<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login- Fusion</title>

    <style>

        body{
            margin: 0;
            font-family: monospace;
            background-color: #ffffff;
            display: flex;
            /*pra deixa no meio, tecnicamente*/
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .Login{
            background-color: #ffffff;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #53AFD6;
            text-align: center;
        }

        h1 {   
            color: #9BC53D;
        }

        p { 
            padding: 10px; 
            color: #53AFD6;  
            margin: 12px auto 12px auto;
            font-size: 15px;
        }

        a{ 
            font-size: 13px;
            color: #53AFD6;  
            font-family: monospace; 
            text-decoration: none;
        }

        a:hover{
            color: #3b7c98;
            transition: 0.5s;
        }


        input{
            font-family: monospace;
            border-radius: 8px;
            text-align: left;
            padding: 12px;
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 15px;
            border-color: #53afd690;
            background-color: #f3fbff;

        }


        button{
            background: #9BC53D;
            width: 100%;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            padding: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin: 10px auto 10px auto;
            color: #256837;

        }
        
        button:hover{
            background: #CCD645;
            transition: 0.5s;
            color: #ffffff;
        }
            
    </style>
</head>


<body>
    <div class="Login">
        <h1>🎮 Fusion 🎾</h1>

        <p>Entre na sua conta</p>

        <form action="home.html">

            <input type="email" placeholder="Digite seu e-mail">
            <input type="password" placeholder="Digite sua senha">
            
            <button type="submit">Entrar</button>

        </form>

    <p>
        <a href="#">Criar conta</a>
    </p>
       
    </div>


</body>
</html>
